# The metronome Worker (PLAN M7). Deployed by the worker-deploy
# workflow on any push to main touching worker/ — including the
# PROJECTS edit below, so adding a project cannot be half-done.
# By hand: cd worker && npx wrangler deploy (see README).
name = "pipeline-metronome"
main = "index.ts"
compatibility_date = "2026-01-01"

[triggers]
# Every 5 minutes, one cron however many projects are listed. This is
# the polled loop's cadence; the CI hops are event-driven in each
# project repo and never wait for it (DESIGN §13).
crons = ["*/5 * * * *"]

[vars]
# One entry per project repo. Adding a project is an edit here plus a
# redeploy — and adding that repo to DISPATCH_TOKEN's repository list.
PROJECTS = '''[
  {"repository": "swaggerallen/orchestration-dummy", "workflow": "pipeline-sweep.yml", "ref": "main"}
]'''
