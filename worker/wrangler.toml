# The metronome Worker (PLAN M7). Deployed by the worker-deploy
# workflow on any push to main touching worker/ — including the
# PROJECTS edit below, so adding a project cannot be half-done.
# By hand: cd worker && npx wrangler deploy (see README).
name = "pipeline-metronome"
main = "index.ts"
compatibility_date = "2026-01-01"

# The webhook endpoint needs a URL. Linear and GitHub both post to
# https://pipeline-metronome.<your-subdomain>.workers.dev — one path,
# told apart by the x-github-event header, each verified against its
# own secret.
workers_dev = true

[triggers]
# Hourly, not every five minutes. Tracker hops arrive on Linear
# webhooks and CI hops on GitHub ones, so what is left for the cron is
# the elapsed-time conditions that have nothing to subscribe to — stale
# claims and deploy timeouts, both past a grace period of tens of
# minutes (DESIGN §12, §13) — plus catching a dropped webhook.
#
# The CI hops used to be left to the project stub's own workflow_run
# trigger. They cannot be: GitHub does not start a workflow run from an
# event created with GITHUB_TOKEN, and the dev agent pushes with exactly
# that, so the stub's trigger fires for a human's commits and never for
# an agent's. Webhook delivery is not workflow triggering, so it reaches
# here instead.
crons = ["0 * * * *"]

[vars]
# One entry per project repo. Adding a project is an edit here plus
# adding that repo to DISPATCH_TOKEN's repository list.
#
# trackerProject is the Linear project id, and it is what routes a
# webhook to one repo. Leave it out and every webhook wakes every
# project — correct, but it spends a run per project per edit.
#
# ciWorkflow is that repo's CI workflow name, defaulting to "ci". Only
# that workflow's completion wakes a sweep, and the filter is a safety
# property: a sweep run completing is itself a workflow_run event, so
# waking on any completed run would have each sweep dispatch the next.
PROJECTS = '''[
  {
    "repository": "swaggerallen/orchestration-dummy",
    "workflow": "pipeline-sweep.yml",
    "ref": "main",
    "trackerProject": "eeeb9f30-dba6-412a-b826-e2279fc56215"
  },
  {
    "repository": "swaggerallen/catapult",
    "workflow": "pipeline-sweep.yml",
    "ref": "main",
    "trackerProject": "2bdba291-161c-4cf4-bbe2-6eab216a2985"
  }
]'''

# The trailing-debounce object, one instance per repository. Webhooks
# arrive in bursts — a state change, its comment and its label edit are
# three events a second apart — and Actions bills each job rounded up to
# the minute, so a burst of six cost six minutes to compute one answer.
# See debounce.ts for why the window is trailing rather than leading.
[[durable_objects.bindings]]
name = "SWEEP_DEBOUNCE"
class_name = "SweepDebounce"

# SQLite-backed, which is the free-plan backend (DESIGN §13).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SweepDebounce"]

# The pipeline's record of its own writes (DESIGN §9). One instance per
# project, addressed by name on the /state/<project>/ path.
[[durable_objects.bindings]]
name = "PROJECT_STATE"
class_name = "ProjectState"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ProjectState"]

# Cloudflare Access, for the dashboard at /dashboard. BOTH UNSET is the
# shipped state and it is not an oversight: with no team domain and no
# audience, no Access identity is ever accepted and the only way into
# /stats stays the shared secret. So this Worker can carry the dashboard
# before the Access application exists without opening anything.
#
# Set them once the application is created (SETUP §9d):
#   ACCESS_TEAM_DOMAIN = "yourteam"      # yourteam.cloudflareaccess.com
#   ACCESS_AUD = "<the application's Audience tag>"
#
# The audience is not decoration. One Access team issues tokens for
# every application in it, all signed by the same keys, so without this
# check a token minted for any other application in the account would
# open this one.
#
# Note what is NOT set here: the Worker keeps workers_dev = true above,
# because the webhooks post to that origin and Access does not front it.
# That is exactly why the JWT is verified rather than read — a header on
# a workers.dev request is whatever the caller typed.

# The pipeline's measurement of itself, one instance per project,
# addressed by name on the /stats/<project>/ path.
#
# A second class rather than more tables on ProjectState: Durable
# Objects serialize requests to one instance, and ProjectState is on the
# dispatch path, so a dashboard aggregation must not be able to queue
# ahead of a reservation (DESIGN §13).
[[durable_objects.bindings]]
name = "PROJECT_STATS"
class_name = "ProjectStats"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ProjectStats"]
