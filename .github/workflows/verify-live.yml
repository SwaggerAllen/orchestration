# Live verification against the scratch Linear team (PLAN M0/M2 gates).
# Triggered by hand; the LINEAR_API_KEY lives only in this repo's Actions
# secrets, so live checks run where the credential lives and never leave it.
#
# The concurrency group is the same one the real control plane will use:
# two dispatchers at once quietly defeat every single-agent guarantee
# downstream (DESIGN §13).
name: verify-live

on:
  workflow_dispatch:
    inputs:
      config:
        description: Path to a pipeline config in this repo
        required: true
        default: configs/scratch.config.json
      apply:
        description: Apply setup and run a live sweep (false = dry-run only)
        type: boolean
        default: false
      setup_only:
        description: >-
          With apply: provision the tracker and stop, without sweeping.
          "Provision the team" and "act on it" are different intentions,
          and only the first is one you want to trigger from a phone.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-control-plane
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      PIPELINE_KILL_SWITCH: ${{ vars.PIPELINE_KILL_SWITCH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Before anything else: a scope this project lacks fails here,
      # loudly, with a ticket-free tracker — rather than at whatever
      # moment first needs it, which for the deploy read was the first
      # ticket ever to reach Merged.
      # Tracker half only, deliberately: GITHUB_REPOSITORY here is the
      # pipeline repo, not the project, so host and deploy checks run
      # against the wrong repository and would fail for a reason that
      # isn't the project's. The project's own preflight stub covers
      # that half, where the token and the repo agree.
      - name: preflight (tracker)
        run: go run ./cmd/pipeline preflight --config "${{ inputs.config }}"

      - name: setup (dry run)
        run: go run ./cmd/pipeline setup --config "${{ inputs.config }}" --dry-run

      - name: setup (apply, then assert idempotence)
        if: ${{ inputs.apply }}
        run: |
          go run ./cmd/pipeline setup --config "${{ inputs.config }}"
          out="$(go run ./cmd/pipeline setup --config "${{ inputs.config }}")"
          echo "$out"
          echo "$out" | grep -q "nothing to do" || {
            echo "::error::second setup run was not a no-op — idempotence gate failed" >&2
            exit 1
          }

      # The sweep reads the team through the state table, so it cannot run
      # against a team setup has never provisioned. With apply unchecked
      # this workflow therefore proves exactly one thing — the config
      # loads and the setup plan is sane — and says so rather than
      # failing on a dependency it declined to satisfy.
      - name: sweep (skipped)
        if: ${{ !inputs.apply }}
        run: |
          echo "sweep checks skipped: the team is not provisioned until setup applies."
          echo "Re-run with apply=true — setup is idempotent, so applying is safe on every run."

      - name: sweep (skipped — setup only)
        if: ${{ inputs.apply && inputs.setup_only }}
        run: echo "setup applied; sweep skipped because setup_only is set."

      - name: sweep (dry run)
        if: ${{ inputs.apply && !inputs.setup_only }}
        run: go run ./cmd/pipeline sweep --config "${{ inputs.config }}" --dry-run

      - name: sweep (apply)
        if: ${{ inputs.apply && !inputs.setup_only }}
        run: go run ./cmd/pipeline sweep --config "${{ inputs.config }}"
