# CI for the pipeline repo itself (PLAN M0). The gates mirror what the
# pipeline will demand of project repos: format, vet, build, test.
name: ci

# PRs into main only. `push: ["**"]` alongside a bare `pull_request` ran
# every commit twice — once for the branch push and once for the PR
# event, on the same tree, for the same verdict. Branch protection reads
# the PR run, so the push run was paying for a second opinion nobody
# asked. Main itself gets no post-merge run of its own; the PR that
# merged into it is the run, and required checks are what make that a
# guarantee rather than a habit.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "not gofmt-formatted:" >&2
            echo "$out" >&2
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

      # The worker suite runs here as well as in worker-deploy.yml, and
      # the duplication is the point rather than an oversight.
      #
      # worker-deploy.yml triggers on `push: branches: [main]`, never on
      # `pull_request`, so before this step the worker tests were a
      # *deploy* gate and not a *merge* gate: a PR breaking one passed
      # CI, merged, and then failed the deploy. That is the worst place
      # for it to fail. A red deploy leaves the metronome serving the
      # previous version — no project visibly loses its beat and nothing
      # reports it, which is the exact failure worker-deploy.yml's own
      # header says the automatic deploy exists to prevent.
      #
      # Added to this job rather than as a job of its own, deliberately.
      # A new job is a new check name, and a check name gates nothing
      # until somebody adds it to branch protection — so it would look
      # armed and be inert, which is the failure this repo keeps paying
      # for. Inside `test` it is required from its first run.
      #
      # Node pinned to 22 to match worker-deploy.yml. If the two drift,
      # the merge gate and the deploy gate are testing different
      # runtimes and the second can still fail after the first passed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: worker test
        working-directory: worker
        run: node --test --experimental-strip-types *.test.ts
