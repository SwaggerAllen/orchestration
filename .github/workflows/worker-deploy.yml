# Deploy the metronome Worker (PLAN M7, SETUP §7).
#
# On every push that touches worker/, plus by hand. Automatic because
# the realistic failure is not a bad deploy, it is a forgotten one:
# adding a project to PROJECTS and never redeploying leaves that repo
# with no beat, and nothing reports it — the sweep simply never runs.
# Deploying from the repo also keeps the deployed script identical to
# the reviewed one, which pasting into the dashboard editor does not.
#
# The token here is NOT the project repos' Cloudflare token. Theirs
# edits Pages and nothing else; this one edits Workers and lives only
# here, so a project repo can never deploy the control plane's
# metronome.
name: worker-deploy

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/workflows/worker-deploy.yml
  workflow_dispatch:

# checkout needs contents:read, and an empty block grants nothing — on a
# private repo that surfaces as "Repository not found", which reads as a
# bad URL rather than a missing permission.
permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check the secrets are present
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          LINEAR_WEBHOOK_SECRET: ${{ secrets.LINEAR_WEBHOOK_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          # wrangler deploys happily with an empty secret. The failures
          # land later and quietly: a blank DISPATCH_TOKEN 401s against
          # GitHub every beat, and a blank LINEAR_WEBHOOK_SECRET makes
          # every webhook fail verification, which looks exactly like a
          # pipeline that has simply gone slow.
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::DISPATCH_TOKEN is not set on this repository — the metronome would deploy and then fail every beat"
            exit 1
          fi
          if [ -z "$LINEAR_WEBHOOK_SECRET" ]; then
            echo "::error::LINEAR_WEBHOOK_SECRET is not set — every Linear webhook would be rejected and the pipeline would fall back to the hourly cron"
            exit 1
          fi
          # Whitespace is the failure this check exists for. Neither
          # GitHub nor the Worker trims a secret, and GitHub's webhook
          # Secret box cannot hold a newline — so a value pasted into
          # the Actions secret with one trailing behind it verifies
          # against nothing, while looking identical to the eye in both
          # places. The symptom is every webhook 401ing with correct
          # secrets on both sides.
          for name in DISPATCH_TOKEN LINEAR_WEBHOOK_SECRET WEBHOOK_SECRET; do
            value="${!name}"
            trimmed="$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -n "$value" ] && [ "$value" != "$trimmed" ]; then
              echo "::error::$name has leading or trailing whitespace (${#value} chars, ${#trimmed} trimmed). Nothing trims it later, so it will not match the value you typed into the sender's settings. Re-add the secret without the stray character."
              exit 1
            fi
          done
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::WEBHOOK_SECRET is not set — every GitHub webhook would be rejected, and the CI and deploy hops would wait for the hourly cron. They cannot fall back to the project's own workflow triggers: GitHub does not start a run from an event created with GITHUB_TOKEN, which is what every agent pushes with."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: test
        working-directory: worker
        # The signature check is the only thing standing between a
        # public URL and a token that starts workflows in every project
        # repo. It is not deployed untested.
        run: node --test --experimental-strip-types index.test.ts

      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Uploaded on every deploy, so the secret is never set by hand
          # and never drifts from the value in this repo's settings.
          secrets: |
            DISPATCH_TOKEN
            LINEAR_WEBHOOK_SECRET
            WEBHOOK_SECRET
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          LINEAR_WEBHOOK_SECRET: ${{ secrets.LINEAR_WEBHOOK_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

      - name: what was deployed
        run: |
          echo "PROJECTS the metronome will now fire each tick:"
          sed -n '/^PROJECTS/,/'"'''"'$/p' worker/wrangler.toml
