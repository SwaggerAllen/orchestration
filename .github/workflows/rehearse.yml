# Ring-3 rehearsal against the disposable project (PLAN §2).
#
# Lives here and is deliberately absent from examples/stubs. The reset
# phase archives every ticket in a project and rewrites a branch's
# contents; a destructive workflow shipped as a stub is one that
# eventually lands in a real project repo. Nothing here is ever copied
# to a project.
#
# Four phases, run one at a time so a human can look between them:
#
#   reset  — archive every ticket, revert what the last run merged
#   seed   — create the scenario's milestones and tickets
#   check  — assert where everything ended up
#   full   — reset then seed, and stop; the pipeline does the middle
#
# There is no "exercise" phase because there is nothing to run: after
# seed, the real metronome, the real webhooks and the real agents carry
# the tickets. That is the point of Ring 3 — the harness sets the table
# and then gets out of the way.
name: rehearse
run-name: "rehearse: ${{ inputs.phase }} ${{ inputs.scenario }}"

on:
  workflow_dispatch:
    inputs:
      phase:
        description: What to do
        required: true
        type: choice
        options: [full, reset, seed, check]
        default: full
      scenario:
        description: Scenario file under scenarios/
        required: true
        type: string
        default: single-ticket.json
      config:
        description: Config naming the disposable project
        required: false
        type: string
        default: configs/scratch.config.json

permissions:
  contents: read

# One rehearsal at a time. Two resets racing would interleave archive
# and create against the same project and leave a state no scenario
# describes.
concurrency:
  group: rehearse
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      SCENARIO: scenarios/${{ inputs.scenario }}
      CONFIG: ${{ inputs.config }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: read the project id from the config
        id: cfg
        run: |
          # Reset takes the project id as a second key, and reading it
          # from the config the command will also read means the two
          # cannot disagree. The guard that matters is elsewhere: the
          # config must declare itself disposable.
          echo "project=$(jq -r .tracker.projectId "$CONFIG")" >> "$GITHUB_OUTPUT"
          echo "disposable=$(jq -r '.disposable // false' "$CONFIG")" >> "$GITHUB_OUTPUT"

      - name: refuse a config that is not disposable
        if: steps.cfg.outputs.disposable != 'true'
        run: |
          echo "::error::${{ env.CONFIG }} does not set \"disposable\": true — this workflow archives every ticket in the project and reverts commits on its main, and only a rehearsal project may carry that flag"
          exit 1

      # Parking the project is what makes an idle rehearsal repo free:
      # PIPELINE_KILL_SWITCH skips the sweep job outright, and a skipped
      # job is billed nothing. The cost is that a rehearsal seeded into a
      # parked project sits there doing nothing at all — no dispatches,
      # no transitions, no error — which is indistinguishable from a
      # pipeline that has broken. That silence is worth minutes of
      # someone's afternoon, so it is spent here instead.
      #
      # Not on `reset`: clearing the tracker while the project is parked
      # is the ordinary way to tidy up after a run, and the flag is no
      # obstacle to it. Only starting or judging a rehearsal needs the
      # beat running.
      - name: refuse to rehearse against a parked project
        if: inputs.phase != 'reset'
        env:
          GH_TOKEN: ${{ secrets.REHEARSAL_REPO_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/SwaggerAllen/orchestration-dummy/actions/variables/PIPELINE_KILL_SWITCH"
          BODY="$RUNNER_TEMP/killswitch.json"
          CODE="$(curl -sS -o "$BODY" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$API")"

          case "$CODE" in
          404)
            echo "PIPELINE_KILL_SWITCH is not set — the project is live."
            ;;
          200)
            VALUE="$(jq -r .value "$BODY")"
            if [ "$VALUE" = "true" ]; then
              echo "::error::orchestration-dummy is parked (PIPELINE_KILL_SWITCH=true), so its sweep job is skipped and nothing will move the tickets this run seeds. Clear the variable — Settings → Secrets and variables → Actions → Variables — and run this again. Set it back when the rehearsal is over; an idle project on the hourly beat costs about 730 Actions minutes a month."
              exit 1
            fi
            echo "PIPELINE_KILL_SWITCH=$VALUE — the project is live."
            ;;
          *)
            # Reading the flag needs Variables → Read on the token, which
            # a PAT minted for the reset alone will not carry. Warn
            # rather than fail: an unreadable flag is not evidence of a
            # parked project, and blocking every rehearsal on a scope
            # this workflow does not otherwise need would trade a silent
            # failure for a loud one that is usually wrong.
            echo "::warning::could not read PIPELINE_KILL_SWITCH (HTTP $CODE) — proceeding without the check. Add Variables → Read to REHEARSAL_REPO_TOKEN to arm it."
            cat "$BODY"
            ;;
          esac

      - name: checkout the project repo
        uses: actions/checkout@v4
        with:
          repository: SwaggerAllen/orchestration-dummy
          path: .project
          fetch-depth: 0
          token: ${{ secrets.REHEARSAL_REPO_TOKEN }}

      - name: reset the tracker
        if: inputs.phase == 'reset' || inputs.phase == 'full'
        run: |
          go run ./cmd/pipeline scenario reset \
            --config "$CONFIG" \
            --confirm "${{ steps.cfg.outputs.project }}" \
            --merged-out "$RUNNER_TEMP/merges.json"

      # Undo what the last rehearsal landed, and nothing else.
      #
      # This used to force-push main back to the seed tag, which threw
      # away every commit merged since — and most commits on a scratch
      # project are infrastructure, not rehearsal output. Keeping the
      # tag current meant re-cherry-picking and re-tagging after each of
      # those merges, a chore whose omission is silent: a rehearsal
      # started from a stale scaffold still reports a pass.
      #
      # Reverting instead needs no force, so branch protection on main
      # and rehearsals can coexist, and the seed tag becomes a reference
      # point rather than a destination that has to be kept moving.
      #
      # Which commits are the rehearsal's is not guessed from subjects
      # or branch names: reconcile writes a `merged` marker carrying the
      # squash sha on the ticket, and the tracker step above hands them
      # over. The pipeline squash-merges, so each is a single commit —
      # an ordinary revert, no merge-parent to choose.
      - name: revert what the last rehearsal merged
        if: inputs.phase == 'reset' || inputs.phase == 'full'
        working-directory: .project
        run: |
          set -euo pipefail
          git config user.name "pipeline-rehearsal"
          git config user.email "pipeline@invalid"
          git checkout -q main
          git pull -q --ff-only origin main

          MERGES="$RUNNER_TEMP/merges.json"
          if [ ! -f "$MERGES" ]; then
            echo "::error::the tracker step wrote no merge list — refusing to guess what to revert"
            exit 1
          fi

          # Shape-checked rather than tolerated. `jq '.[]?'` would treat
          # a malformed file as an empty one and quietly revert nothing,
          # which is the failure this step exists to prevent — so an
          # array is required and anything else stops the run.
          if ! jq -e 'type == "array"' "$MERGES" >/dev/null; then
            echo "::error::$MERGES is not a JSON array — refusing to guess what to revert"
            cat "$MERGES"
            exit 1
          fi

          # Newest first: reverting in reverse landing order is the only
          # order that applies cleanly when two tickets touched the same
          # file.
          SHAS="$(jq -r '.[].sha' "$MERGES" | tac)"
          if [ -z "$SHAS" ]; then
            echo "the last rehearsal merged nothing; main is left as it is"
          fi
          for sha in $SHAS; do
            if ! git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then
              echo "  $sha is not on main (reverted by hand, or never landed) — skipping"
              continue
            fi
            if git rev-list --grep="^This reverts commit ${sha}" HEAD | grep -q .; then
              echo "  $sha already reverted — skipping"
              continue
            fi
            echo "  reverting $sha"
            # No -X ours, no --strategy: a conflict means an
            # infrastructure commit touched the same lines this ticket
            # did, and resolving that automatically would start the next
            # rehearsal from a tree nobody chose.
            if ! git revert --no-edit "$sha"; then
              echo "::error::reverting $sha conflicts with work merged since. Resolve it by hand on main, then re-run reset."
              git revert --abort || true
              git status --porcelain
              exit 1
            fi
          done

          # What survived, so a stale baseline is visible rather than
          # assumed. The seed tag is the anchor this is measured from.
          #
          # Into the run summary as well as the log: the whole point of
          # this list is to be *noticed*, and a line nobody expands is a
          # line nobody reads. A rehearsal started from a scaffold that
          # has quietly drifted still reports a pass.
          KEPT="$(git log --oneline --first-parent "$(git rev-parse refs/tags/seed 2>/dev/null || git rev-list --max-parents=0 HEAD)"..HEAD || true)"
          echo "kept on main since the seed tag:"
          echo "$KEPT" | sed 's/^/  /'
          {
            echo "## Baseline"
            echo
            if [ -z "$KEPT" ]; then
              echo "Nothing on \`main\` since the seed tag — this rehearsal starts from the scaffold itself."
            else
              echo "Kept on \`main\` since the seed tag. These are infrastructure commits the reset deliberately did not revert, and they are the tree this rehearsal starts from:"
              echo
              echo '```'
              echo "$KEPT"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          git push origin main

          # Every branch the pipeline made last run. main is what
          # survives; anything else is last run's litter.
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
                       | sed 's|^origin/||' | grep -v -e '^main$' -e '^HEAD$'); do
            echo "  deleting branch $ref"
            git push origin --delete "$ref" || echo "  (already gone)"
          done

      - name: seed the scenario
        if: inputs.phase == 'seed' || inputs.phase == 'full'
        run: |
          go run ./cmd/pipeline scenario seed \
            --config "$CONFIG" \
            --scenario "$SCENARIO" \
            --out seeded.json
          cat seeded.json

      - name: keep the seed map for the check phase
        if: inputs.phase == 'seed' || inputs.phase == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: seeded-${{ inputs.scenario }}
          path: seeded.json
          retention-days: 14

      - name: fetch the seed map
        if: inputs.phase == 'check'
        uses: actions/download-artifact@v4
        with:
          name: seeded-${{ inputs.scenario }}

      - name: check
        if: inputs.phase == 'check'
        run: |
          # The project checkout is on main, which is where merged work
          # lands, so file expectations are asserted against the result
          # rather than against a branch.
          git -C .project fetch origin main --quiet
          git -C .project checkout --quiet origin/main
          go run ./cmd/pipeline scenario check \
            --config "$CONFIG" \
            --scenario "$SCENARIO" \
            --seeded seeded.json \
            --repo .project

      - name: what happens next
        if: (inputs.phase == 'full' || inputs.phase == 'seed') && success()
        run: |
          echo "Seeded. The metronome and webhooks take it from here."
          echo "Your touchpoints are the designed ones: sign off at Design review, and the boundary pass."
          echo "When it settles, run this workflow again with phase=check."
