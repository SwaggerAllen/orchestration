# Reusable reconcile-agent run (PLAN M4). Dispatched by the sweep when CI
# goes green on a non-draft PR and the ticket enters Reconciling. The
# harness brackets the model: claim asserts state and finds the PR, the
# model reads the diff and writes a verdict, finish lands the outcome —
# merge on pass/cannot-tell, bounce on fail (DESIGN §11).
name: agent-reconcile

on:
  workflow_call:
    inputs:
      ticket:
        description: Ticket key, e.g. PIPE-12
        required: true
        type: string
      pipeline_ref:
        description: Pipeline repo ref to run the harness from
        required: false
        type: string
        default: main
    secrets:
      LINEAR_API_KEY:
        required: true
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: checkout pipeline
        uses: actions/checkout@v4
        with:
          repository: SwaggerAllen/orchestration
          ref: ${{ inputs.pipeline_ref }}
          path: .pipeline

      - uses: actions/setup-go@v5
        with:
          go-version-file: .pipeline/go.mod

      - name: claim
        id: claim
        run: |
          go -C "$GITHUB_WORKSPACE/.pipeline" run ./cmd/pipeline agent claim \
            --kind reconcile \
            --config "$GITHUB_WORKSPACE/pipeline.config.json" \
            --ticket "${{ inputs.ticket }}" \
            --dispatch-id "${{ github.run_id }}" \
            --dispatch-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out "$RUNNER_TEMP/pipeline" \
            --prompt-template "$GITHUB_WORKSPACE/.pipeline/prompts/reconcile.md" \
            --verdict-path "$RUNNER_TEMP/pipeline/verdict.json"

      - name: check out the PR branch (read-only inspection)
        run: |
          git fetch origin "${{ steps.claim.outputs.branch }}" origin/main
          git checkout "${{ steps.claim.outputs.branch }}"

      - name: run the reconcile agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx --yes @anthropic-ai/claude-code@latest \
            -p "$(cat "$RUNNER_TEMP/pipeline/prompt.md")" \
            --dangerously-skip-permissions

      - name: finish
        run: |
          go -C "$GITHUB_WORKSPACE/.pipeline" run ./cmd/pipeline agent finish \
            --config "$GITHUB_WORKSPACE/pipeline.config.json" \
            --claim "$RUNNER_TEMP/pipeline/claim.json" \
            --verdict "$RUNNER_TEMP/pipeline/verdict.json"

      - name: abort on failure
        if: failure() && steps.claim.outcome == 'success'
        run: |
          go -C "$GITHUB_WORKSPACE/.pipeline" run ./cmd/pipeline agent abort \
            --config "$GITHUB_WORKSPACE/pipeline.config.json" \
            --claim "$RUNNER_TEMP/pipeline/claim.json" \
            --reason failed \
            --message "Reconcile run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
