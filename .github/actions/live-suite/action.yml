# Live-suite run (DESIGN §10). Dispatched by the sweep when the boundary
# ticket opens, before the author's pass: the once-per-milestone
# real-network check. The run reports its own verdict, like every agent.
#
# A composite action rather than a reusable workflow for the reason that
# matters most here: the suite is the project's own test command, so the
# project's toolchain has to be set up first, by steps only the calling
# job can run. The old reusable workflow carried a comment saying the
# toolchain "belongs in the stub" — which its own shape made impossible.
name: pipeline live suite
description: Run the project's live suite and report the result on the boundary ticket

inputs:
  ticket:
    description: Boundary ticket key
    required: true
  command:
    description: The project's live-suite command, e.g. "mix test --only live"
    required: true
  linear_api_key:
    description: Linear API key
    required: true
  github_token:
    # Described in prose, not as an expression: an action's metadata is
    # templated and the github context does not exist there, so an
    # expression here fails the whole file to load before any step runs.
    description: Token for the project repo. Pass the caller's github.token.
    required: true
  pipeline_repo_token:
    description: >-
      Contents:read PAT for the pipeline repo while it is private.
      Falls back to github_token, which suffices once it is public.
    required: false
    default: ""
  no_tests_pattern:
    description: >-
      How this project's test runner says the filter matched nothing.
      A runner given a tag filter that matches no test exits non-zero —
      ExUnit prints "no test was executed" — so a project that has not
      written its first live test yet reports a FAILING live suite at
      every boundary, for a structural reason, which is how the one
      automated signal the boundary has gets trained into noise. Matched
      against the suite's output to tell that apart from a real failure.
      Set to something unmatchable to turn the distinction off.
    required: false
    default: "no test was executed"
  pipeline_ref:
    description: Pipeline repo ref to run the harness from
    required: false
    default: main

runs:
  using: composite
  steps:
    # Nested rather than asked of the caller so a project's stub needs
    # no change to get this. The ref pins the *recipe*; the binary it
    # builds comes from inputs.pipeline_ref, so a caller pinned to a
    # release still runs that release's harness.
    - name: set up the pipeline
      uses: SwaggerAllen/orchestration/.github/actions/setup-pipeline@main
      with:
        pipeline_repo_token: ${{ inputs.pipeline_repo_token }}
        pipeline_ref: ${{ inputs.pipeline_ref }}

    # Output is captured as well as shown, so the next step can tell
    # "the filter matched no tests" from "tests ran and failed". Both
    # exit non-zero and they are not the same fact.
    - name: run live suite
      id: suite
      shell: bash
      continue-on-error: true
      env:
        LIVE_COMMAND: ${{ inputs.command }}
      run: |
        set -o pipefail
        eval "$LIVE_COMMAND" 2>&1 | tee "$RUNNER_TEMP/live-suite.log"

    - name: read the verdict
      id: verdict
      shell: bash
      env:
        NO_TESTS: ${{ inputs.no_tests_pattern }}
      run: |
        if [ "${{ steps.suite.outcome }}" = "success" ]; then
          echo "result=pass" >> "$GITHUB_OUTPUT"
        elif [ -n "$NO_TESTS" ] && grep -qF -- "$NO_TESTS" "$RUNNER_TEMP/live-suite.log"; then
          echo "result=no-tests" >> "$GITHUB_OUTPUT"
        else
          echo "result=fail" >> "$GITHUB_OUTPUT"
        fi

    - name: report
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        pipeline agent live-suite-report \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --ticket "${{ inputs.ticket }}" \
          --result "${{ steps.verdict.outputs.result }}" \
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    # The job's own status mirrors the suite so the run is red in the
    # Actions UI when the suite failed — the marker is the record, but a
    # green run wrapping a red suite misleads at a glance.
    #
    # Not red for no-tests. A project that has not written its first live
    # test is not broken, and a gate that is red on every project's first
    # boundary is a gate the author learns to skip past — which costs
    # more than the missing coverage does. The ticket says plainly that
    # nothing was checked; that is the signal, and it is in the place the
    # author actually reads at a boundary.
    - name: propagate failure
      if: steps.verdict.outputs.result == 'fail'
      shell: bash
      run: exit 1
