# Live-suite run (DESIGN §10). Dispatched by the sweep when the boundary
# ticket opens, before the author's pass: the once-per-milestone
# real-network check. The run reports its own verdict, like every agent.
#
# A composite action rather than a reusable workflow for the reason that
# matters most here: the suite is the project's own test command, so the
# project's toolchain has to be set up first, by steps only the calling
# job can run. The old reusable workflow carried a comment saying the
# toolchain "belongs in the stub" — which its own shape made impossible.
name: pipeline live suite
description: Run the project's live suite and report the result on the boundary ticket

inputs:
  ticket:
    description: Boundary ticket key
    required: true
  command:
    description: The project's live-suite command, e.g. "mix test --only live"
    required: true
  linear_api_key:
    description: Linear API key
    required: true
  github_token:
    description: Token for the project repo; pass ${{ github.token }}
    required: true
  pipeline_repo_token:
    description: >-
      Contents:read PAT for the pipeline repo while it is private.
      Falls back to github_token, which suffices once it is public.
    required: false
    default: ""
  pipeline_ref:
    description: Pipeline repo ref to run the harness from
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: checkout pipeline
      uses: actions/checkout@v4
      with:
        repository: SwaggerAllen/orchestration
        ref: ${{ inputs.pipeline_ref }}
        path: .pipeline
        token: ${{ inputs.pipeline_repo_token || github.token }}

    - uses: actions/setup-go@v5
      with:
        go-version-file: .pipeline/go.mod

    - name: run live suite
      id: suite
      shell: bash
      continue-on-error: true
      run: ${{ inputs.command }}

    - name: report
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        go -C "$GITHUB_WORKSPACE/.pipeline" run ./cmd/pipeline agent live-suite-report \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --ticket "${{ inputs.ticket }}" \
          --result "${{ steps.suite.outcome == 'success' && 'pass' || 'fail' }}" \
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    # The job's own status mirrors the suite so the run is red in the
    # Actions UI when the suite failed — the marker is the record, but a
    # green run wrapping a red suite misleads at a glance.
    - name: propagate failure
      if: steps.suite.outcome != 'success'
      shell: bash
      run: exit 1
