# Boundary-agent run (DESIGN §10): archive, debt scan, grooming. Each
# step posts its own marker, and a resumed pass skips the steps whose
# markers are already there — so a crash costs the step, not the pass.
#
# A composite action rather than a reusable workflow, because the calling
# job must be able to run its own steps first: a project's toolchain is
# project-specific and no reusable workflow can accept `uses:` steps as
# an input. The caller checks out the project, sets up its language, then
# calls this — see examples/stubs/pipeline-agent-boundary.yml.
#
# The caller's checkout needs fetch-depth: 0; the retro note is written
# against history.
name: pipeline boundary agent
description: Run a milestone boundary pass — archive, debt scan, grooming

inputs:
  ticket:
    description: Boundary ticket key
    required: true
  linear_api_key:
    description: Linear API key
    required: true
  pipeline_state_token:
    description: >
      Secret for the pipeline's own move record (DESIGN 9). Every
      transition is written down before it is made, and a project
      without this records nothing — which turns the invariants off
      rather than failing, so its absence is worth noticing.
    required: false
    default: ""
  github_token:
    # Described in prose, not as an expression: an action's metadata is
    # templated and the github context does not exist there, so an
    # expression here fails the whole file to load before any step runs.
    description: Token for the project repo. Pass the caller's github.token.
    required: true
  anthropic_api_key:
    description: >-
      Console API key for the agent run, billed against API credits.
      Optional when a subscription token is set, where it is the
      failover rather than the first choice.
    required: false
    default: ""
  claude_code_oauth_token:
    description: >-
      Long-lived Claude Code token from `claude setup-token`, billed
      against a Claude subscription. Tried before anthropic_api_key.
    required: false
    default: ""
  pipeline_repo_token:
    description: >-
      Contents:read PAT for the pipeline repo while it is private.
      Falls back to github_token, which suffices once it is public.
    required: false
    default: ""
  pipeline_ref:
    description: Pipeline repo ref to run the harness from
    required: false
    default: main

runs:
  using: composite
  steps:
    # Nested rather than asked of the caller so a project's stub needs
    # no change to get this. The ref pins the *recipe*; the binary it
    # builds comes from inputs.pipeline_ref, so a caller pinned to a
    # release still runs that release's harness.
    - name: set up the pipeline
      uses: SwaggerAllen/orchestration/.github/actions/setup-pipeline@main
      with:
        pipeline_repo_token: ${{ inputs.pipeline_repo_token }}
        pipeline_ref: ${{ inputs.pipeline_ref }}

    - name: claim
      id: claim
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        PIPELINE_STATE_TOKEN: ${{ inputs.pipeline_state_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        # stderr is captured as well as shown, because the step after
        # this one puts it on the ticket. A claim that dies takes the
        # only other channel with it: abort needs claim.json to know
        # what it is aborting, so the loudest failures used to leave
        # nothing at all behind (DESIGN §12).
        # mkdir first: the redirect below opens the file before the
        # claim runs, and the claim is what would otherwise create the
        # directory — so without this the step dies on the redirect,
        # before the command it is trying to capture.
        mkdir -p "$RUNNER_TEMP/pipeline"
        set +e
        pipeline agent claim \
          --kind boundary \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --ticket "${{ inputs.ticket }}" \
          --dispatch-id "${{ github.run_id }}" \
          --dispatch-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --out "$RUNNER_TEMP/pipeline" \
          --prompt-template "$GITHUB_WORKSPACE/.pipeline/prompts/boundary.md" \
          --repo-context "$GITHUB_WORKSPACE/.pipeline/prompts/repo-context.md" \
          --outcome-path "$RUNNER_TEMP/pipeline/proposals.json" \
          --findings-path "$RUNNER_TEMP/pipeline/findings.json" \
          2> "$RUNNER_TEMP/pipeline/claim-error.txt"
        rc=$?
        cat "$RUNNER_TEMP/pipeline/claim-error.txt" >&2
        exit $rc

    - name: archive pass + retro note
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        PIPELINE_STATE_TOKEN: ${{ inputs.pipeline_state_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        pipeline agent boundary-archive \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --claim "$RUNNER_TEMP/pipeline/claim.json"

    # The step above committed the retro note through the contents API,
    # straight to the default branch — the boundary opens no PR (DESIGN
    # §10). That write lands on the remote; this checkout was taken
    # before it and knows nothing about it.
    #
    # The scan below then reads a tree with no docs/retros/ in it and
    # concludes the note was never written, which is exactly what it
    # reported on the first boundary after the note started carrying
    # merge shas. Its own prompt names that note twice as load-bearing:
    # the marker for "diffs merged since the last boundary", and the
    # duplicate detector standing in for tracker search over archived
    # work. Handing the model a tree the harness has already moved past
    # is handing it the wrong repository.
    #
    # A warning rather than a failure. The scan is read-mostly and its
    # inputs are bounded, so a stale tree degrades it rather than
    # breaking it — and a boundary that refuses to run over a
    # fast-forward is one that needs a human for something a human
    # cannot fix from a phone. If the note really is missing the model
    # says so, which is how this was found.
    - name: pick up the retro note the archive just wrote
      shell: bash
      run: |
        set -uo pipefail
        git fetch -q origin main
        if git merge --ff-only -q FETCH_HEAD; then
          echo "checkout fast-forwarded to origin/main; the retro note is in the tree"
        else
          echo "::warning::could not fast-forward this checkout to origin/main — the debt scan will read a tree without the retro note the archive step just wrote, and may report it missing"
        fi

    - name: debt scan + grooming
      if: steps.claim.outputs.scan_done != 'true'
      uses: SwaggerAllen/orchestration/.github/actions/run-agent-model@main
      with:
        prompt_path: ${{ runner.temp }}/pipeline/prompt.md
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        anthropic_api_key: ${{ inputs.anthropic_api_key }}

    - name: file proposals and hand back
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        PIPELINE_STATE_TOKEN: ${{ inputs.pipeline_state_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        ARGS=(--config "$GITHUB_WORKSPACE/pipeline.config.json" --claim "$RUNNER_TEMP/pipeline/claim.json")
        ARGS+=(--findings "$RUNNER_TEMP/pipeline/findings.json")
        if [ "${{ steps.claim.outputs.scan_done }}" != "true" ]; then
          ARGS+=(--proposals "$RUNNER_TEMP/pipeline/proposals.json")
        fi
        pipeline agent boundary-file "${ARGS[@]}"

    - name: say so when the claim itself failed
      if: failure() && steps.claim.outcome == 'failure'
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
      run: |
        # Deliberately no state move: a pickup assertion that refuses is
        # the guard working and the ticket is fine where it is, while a
        # snapshot that could not be built is the harness broken, and
        # this step cannot tell them apart. The stale-claim rule owns
        # the transition either way.
        pipeline agent claim-failed \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --ticket "${{ inputs.ticket }}" \
          --kind boundary \
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --error-file "$RUNNER_TEMP/pipeline/claim-error.txt"

    - name: abort on failure
      if: failure() && steps.claim.outcome == 'success'
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        PIPELINE_STATE_TOKEN: ${{ inputs.pipeline_state_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        pipeline agent abort \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --claim "$RUNNER_TEMP/pipeline/claim.json" \
          --reason failed \
          --findings "$RUNNER_TEMP/pipeline/findings.json" \
          --message "Boundary run failed; move the ticket back to In progress to resume from the last completed step (DESIGN 10). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
