# Dev-agent run (PLAN M3). The harness brackets the model: claim does
# the pickup assertions and the state-transition-as-claim, the model
# works, finish posts the hand-back and flips the PR out of draft.
# Every protocol obligation is Go code under test; the model only does
# the work in between.
#
# A composite action rather than a reusable workflow, because the calling
# job must be able to run its own steps first: a project's toolchain is
# project-specific and no reusable workflow can accept `uses:` steps as
# an input. The caller checks out the project, sets up its language, then
# calls this — see examples/stubs/pipeline-agent-dev.yml.
#
# The caller's checkout needs fetch-depth: 0; the branch work below
# fetches and switches refs.
name: pipeline dev agent
description: Claim a ticket, implement it, hand back

inputs:
  ticket:
    description: Ticket key, e.g. PIPE-12
    required: true
  linear_api_key:
    description: Linear API key
    required: true
  pipeline_state_token:
    description: >
      Secret for the pipeline's own move record (DESIGN 9). Every
      transition is written down before it is made, and a project
      without this records nothing — which turns the invariants off
      rather than failing, so its absence is worth noticing.
    required: false
    default: ""
  github_token:
    # Described in prose, not as an expression: an action's metadata is
    # templated and the github context does not exist there, so an
    # expression here fails the whole file to load before any step runs.
    description: Token for the project repo. Pass the caller's github.token.
    required: true
  cloudflare_api_token:
    description: >-
      Cloudflare token with Pages edit rights, for publishing this
      branch's storybook export. Omit to skip publishing.
    required: false
    default: ""
  cloudflare_account_id:
    description: Cloudflare account id, alongside cloudflare_api_token
    required: false
    default: ""
  pipeline_repo_token:
    description: >-
      Contents:read PAT for the pipeline repo while it is private.
      Falls back to github_token, which suffices once it is public.
    required: false
    default: ""
  pipeline_ref:
    description: Pipeline repo ref to run the harness from
    required: false
    default: main
  anthropic_api_key:
    description: >-
      Console API key for the agent run, billed against API credits.
      Optional when a subscription token is set, where it is the
      failover rather than the first choice.
    required: false
    default: ""
  claude_code_oauth_token:
    description: >-
      Long-lived Claude Code token from `claude setup-token`, billed
      against a Claude subscription. Tried before anthropic_api_key.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Nested rather than asked of the caller so a project's stub needs
    # no change to get this. The ref pins the *recipe*; the binary it
    # builds comes from inputs.pipeline_ref, so a caller pinned to a
    # release still runs that release's harness.
    - name: set up the pipeline
      uses: SwaggerAllen/orchestration/.github/actions/setup-pipeline@main
      with:
        pipeline_repo_token: ${{ inputs.pipeline_repo_token }}
        pipeline_ref: ${{ inputs.pipeline_ref }}

    - name: claim
      id: claim
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        PIPELINE_STATE_TOKEN: ${{ inputs.pipeline_state_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        pipeline agent claim \
          --kind dev \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --ticket "${{ inputs.ticket }}" \
          --dispatch-id "${{ github.run_id }}" \
          --dispatch-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --out "$RUNNER_TEMP/pipeline" \
          --prompt-template "$GITHUB_WORKSPACE/.pipeline/prompts/dev.md" \
          --repo-context "$GITHUB_WORKSPACE/.pipeline/prompts/repo-context.md" \
          --handback-path "$RUNNER_TEMP/pipeline/handback.md" \
          --outcome-path "$RUNNER_TEMP/pipeline/outcome.json" \
          --findings-path "$RUNNER_TEMP/pipeline/findings.json"

    - name: check out the ticket branch
      id: checkout
      shell: bash
      run: |
        git config user.name "pipeline-dev-agent"
        git config user.email "pipeline@invalid"
        BRANCH="${{ steps.claim.outputs.branch }}"
        git fetch origin
        git checkout -B "$BRANCH" "origin/$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" origin/main
        # The pipeline checkout must not ride along in the project branch.
        echo ".pipeline/" >> .git/info/exclude
        # Where this pass started. The push step compares against it to
        # tell "the model changed nothing" from "the branch is empty" —
        # two different facts that the commit count against main cannot
        # separate, because it counts every pass's work.
        echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: run the dev agent
      uses: SwaggerAllen/orchestration/.github/actions/run-agent-model@main
      with:
        prompt_path: ${{ runner.temp }}/pipeline/prompt.md
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        anthropic_api_key: ${{ inputs.anthropic_api_key }}

    - name: push
      id: push
      shell: bash
      run: |
        set -euo pipefail
        # The prompt tells the model to commit; anything it left behind
        # still belongs to the run rather than the runner's disk.
        if ! git diff --quiet || ! git diff --cached --quiet; then
          git add -A ':!.pipeline'
          git commit -m "wip: uncommitted changes at end of agent run"
        fi

        # Counted here because git is where the answer is, and finish
        # runs from the pipeline checkout. It decides whether there is
        # anything to open a PR with: zero means the run changed nothing
        # main does not already have, which finish parks for the author
        # rather than failing (DESIGN §12).
        #
        # It used to be discovered by the host instead — CreatePR
        # rejected with "No commits between main and <branch>", the step
        # exited non-zero, and `abort on failure` below stamped
        # Blocked/failed on top of a hand-back explaining that changing
        # nothing was the right answer. Measured on ORC-64.
        git fetch -q origin main
        COMMITS="$(git rev-list --count origin/main..HEAD)"
        echo "commits=$COMMITS" >> "$GITHUB_OUTPUT"

        # The same range the CI audit judges, written where finish can
        # read it. A mutex label the run reports is checked against this
        # list before it is attached (DESIGN §7): a lock is taken because
        # the diff is mapped by that doc, never because the run asked.
        git diff --name-only origin/main...HEAD > "$RUNNER_TEMP/pipeline/changed.txt"
        if [ "$COMMITS" -eq 0 ]; then
          echo "the run produced nothing main does not already have; not pushing an empty branch"
          exit 0
        fi

        # A pass that changed no files still needs a fresh verdict, and
        # cannot get one: CI fires on `pull_request`, which needs a
        # push, which needs a commit. So the ticket enters Checks, the
        # sweep reads the verdict already recorded against this same
        # sha, recognises it as one it has already acted on, and says
        # nothing — and Checks has no agent and no stale-claim timeout,
        # so nothing else ever moves it.
        #
        # This is not a corner. The audit reads the ticket's labels from
        # the tracker at CI time, so the verdict is a function of the
        # diff AND the labels: the same sha can be red on Monday and
        # green on Tuesday because a label changed. Catapult's ORC-5 sat
        # in Checks for half an hour that way, on a rework whose entire
        # fix was two label corrections.
        #
        # The empty commit is the cheapest thing that re-arms the
        # trigger. The alternative wants a host capability to re-run a
        # workflow, which the port does not have and which this buys
        # nothing over.
        #
        # Only on the route that reaches Checks: a parked outcome hands
        # the ticket to a human, and a commit asking for a verdict
        # nobody will read is a line in the log that lies about why it
        # is there. Unparseable outcome falls through to making it,
        # which costs a build rather than a stuck ticket.
        OUTCOME=""
        if [ -f "$RUNNER_TEMP/pipeline/outcome.json" ]; then
          # `|| true` because this step runs under `set -e -o pipefail`
          # and a file with no outcome key exits grep 1 — which would
          # take the push down over a field whose absence means "done".
          OUTCOME="$(tr -d ' \t\n' < "$RUNNER_TEMP/pipeline/outcome.json" \
            | grep -oE '"outcome":"[a-z-]+"' | head -1 | sed 's/.*:"//; s/"$//' || true)"
        fi
        if [ "$(git rev-parse HEAD)" = "${{ steps.checkout.outputs.head }}" ] \
          && { [ -z "$OUTCOME" ] || [ "$OUTCOME" = "done" ]; }; then
          echo "this pass changed no files; committing empty so the gates re-run against the ticket as it stands now"
          git commit -q --allow-empty \
            -m "re-run the gates: this pass changed no files" \
            -m "The verdict on this sha predates the pass, and the audit reads the ticket's labels as well as the diff — so it is not an answer to the question being asked now."
        fi
        git push -u origin "${{ steps.claim.outputs.branch }}"

    # The branch preview, published by the harness rather than by a
    # workflow watching for a push. That watcher could never fire for
    # this push: GitHub does not start a workflow run from an event
    # created with GITHUB_TOKEN, which is what the step above pushes
    # with — so previews were built for a human's branches and never for
    # an agent's. The author reviews the storybook export at Design
    # review (DESIGN 4), so the missing one was missing from the exact
    # sign-off it exists for.
    #
    # Skipped rather than failed when no Cloudflare token is passed: a
    # project without previews wired yet still gets its agent runs, and
    # the step says which it did.
    - name: build the storybook export
      if: inputs.cloudflare_api_token != '' && steps.push.outputs.commits != '0'
      shell: bash
      run: |
        set -euo pipefail
        CMD="$(jq -r .preview.buildCommand "$GITHUB_WORKSPACE/pipeline.config.json")"
        echo "preview build: $CMD"
        cd "$GITHUB_WORKSPACE" && eval "$CMD"

    - name: read the preview target
      id: preview
      if: inputs.cloudflare_api_token != '' && steps.push.outputs.commits != '0'
      shell: bash
      run: |
        set -euo pipefail
        CFG="$GITHUB_WORKSPACE/pipeline.config.json"
        # Read from the config, never written here: a second copy drifts,
        # and then previews publish to one project while cleanup deletes
        # from another with nothing to say so.
        echo "project=$(jq -r .preview.pagesProject "$CFG")" >> "$GITHUB_OUTPUT"
        echo "dir=$(jq -r .preview.outputDir "$CFG")" >> "$GITHUB_OUTPUT"

    - name: publish the preview
      if: inputs.cloudflare_api_token != '' && steps.push.outputs.commits != '0'
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare_api_token }}
        accountId: ${{ inputs.cloudflare_account_id }}
        workingDirectory: ${{ github.workspace }}
        command: >-
          pages deploy ${{ steps.preview.outputs.dir }}
          --project-name=${{ steps.preview.outputs.project }}
          --branch=${{ steps.claim.outputs.branch }}
    - name: finish
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        PIPELINE_STATE_TOKEN: ${{ inputs.pipeline_state_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        # `|| -1` is the fallback for an empty output, which means the
        # push step did not get far enough to count. -1 is "unmeasured",
        # and finish refuses it when there is no PR yet rather than
        # reading it as "nothing landed" — the failure of guessing wrong
        # there is a ticket parked over work that was fine.
        pipeline agent finish \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --claim "$RUNNER_TEMP/pipeline/claim.json" \
          --handback "$RUNNER_TEMP/pipeline/handback.md" \
          --commits "${{ steps.push.outputs.commits || -1 }}" \
          --outcome "$RUNNER_TEMP/pipeline/outcome.json" \
          --changed-files "$RUNNER_TEMP/pipeline/changed.txt" \
          --findings "$RUNNER_TEMP/pipeline/findings.json"

    - name: abort on failure
      if: failure() && steps.claim.outcome == 'success'
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        PIPELINE_STATE_TOKEN: ${{ inputs.pipeline_state_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        pipeline agent abort \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --claim "$RUNNER_TEMP/pipeline/claim.json" \
          --reason failed \
          --findings "$RUNNER_TEMP/pipeline/findings.json" \
          --message "Dev agent run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
