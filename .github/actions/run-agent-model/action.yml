# The one place an agent's model pass is actually invoked.
#
# Two credentials can pay for that pass and they are not interchangeable:
#
#   - a Claude Code OAuth token (`claude setup-token`), which bills a
#     Claude subscription and is understood by the Claude Code CLI only —
#     the Messages API rejects it;
#   - a Console API key, which bills API credits.
#
# The subscription is tried first and the key is the failover, so the
# subscription's allowance is spent before anything is billed, and an
# exhausted allowance costs a retry rather than the ticket. Factored out
# of the four agent actions rather than copied into each: the ordering
# below is a policy, and four copies of a policy is three chances to
# change it in one place.
name: pipeline agent model run
description: Run an agent's model pass on the subscription credential, failing over to the API key

inputs:
  prompt_path:
    description: File holding the assembled prompt
    required: true
  claude_code_oauth_token:
    description: >-
      Long-lived Claude Code token from `claude setup-token`, billed
      against a Claude subscription. Tried first when set.
    required: false
    default: ""
  anthropic_api_key:
    description: >-
      Console API key, billed against API credits. Used directly when no
      subscription token is set, and as the failover when a subscription
      run does not complete.
    required: false
    default: ""
  log_dir:
    description: >-
      Where a failed run leaves its evidence (run-error.txt,
      run-exit-code.txt) and the captured streams. Defaults to
      $RUNNER_TEMP/pipeline, which is the directory the agent actions'
      abort steps read. A second model run inside one job — the record
      review inside a design job — passes its own directory, so its
      death is not reported to the author as the first run's cause.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: run the agent
      shell: bash
      # Deliberately NOT named ANTHROPIC_API_KEY and
      # CLAUDE_CODE_OAUTH_TOKEN here. Claude Code resolves credentials in
      # order and ANTHROPIC_API_KEY wins, so a step that exported both
      # would run every "subscription" pass on the API key and report
      # success — the failover would be untestable and the bill would be
      # the tell. Each attempt below names exactly one, on the child
      # process, and unsets the other.
      env:
        SUBSCRIPTION_TOKEN: ${{ inputs.claude_code_oauth_token }}
        API_KEY: ${{ inputs.anthropic_api_key }}
        PROMPT_PATH: ${{ inputs.prompt_path }}
        LOG_DIR: ${{ inputs.log_dir }}
      run: |
        set -uo pipefail

        if [ -z "$SUBSCRIPTION_TOKEN" ] && [ -z "$API_KEY" ]; then
          echo "::error::no model credential — set claude_code_oauth_token (from \`claude setup-token\`) or anthropic_api_key" >&2
          exit 1
        fi
        # Where a failed pass leaves its evidence. Two well-known paths
        # rather than step outputs, for the reason the claim's are files:
        # an output on a failed step is not somewhere to bet a ticket
        # comment on, and the abort step runs precisely when this one
        # failed.
        LOGDIR="${LOG_DIR:-$RUNNER_TEMP/pipeline}"
        mkdir -p "$LOGDIR"
        ERRFILE="$LOGDIR/run-error.txt"
        CODEFILE="$LOGDIR/run-exit-code.txt"
        # Cleared up front and again on success: these files mean "the
        # model run is what failed". Left behind from a first attempt
        # that failed over and succeeded, they would put a stale cause on
        # a ticket whose real failure was somewhere else entirely.
        rm -f "$ERRFILE" "$CODEFILE"

        # The prompt reaches the CLI on stdin, never as an argument.
        #
        # Linux caps a single argv element at MAX_ARG_STRLEN — 32 pages,
        # 131072 bytes on every architecture this runs on — independently
        # of the much larger ARG_MAX for the whole vector. Over that,
        # execve returns E2BIG, which bash reports as "/usr/bin/env:
        # Argument list too long" and exit 126: the credential failover
        # then dutifully retried and hit the identical wall, so a design
        # pass died 35ms in having never invoked the model at all.
        #
        # The prompt is not incidentally large, it is structurally large.
        # It inlines the ticket, its comments, the repo context and the
        # confirmed non-asks (DESIGN §4), each for a stated reason. On
        # Catapult's ORC-84 the harness's own reprompt step measured
        # non-asks.md at 83468 bytes — 64% of the cap before anything
        # else is added — and that document only grows, because passes
        # append to it and never delete.
        #
        # The CLI comes from the `stable` dist-tag, never `latest`.
        #
        # It was `latest`, which made every agent run in every project
        # depend on a third-party publish that can land at any moment
        # with no commit anywhere in this system. On 2026-08-19 one did:
        # 2.1.237 went out at 23:57Z and, installed this way, reports
        # "claude native binary not installed" and exits 1 — its
        # platform-native binary does not arrive through `npx --yes`.
        # Catapult's ORC-6 hit it an hour later and every agent run in
        # the project failed identically.
        #
        # `stable` is a version somebody deliberately promoted, which is
        # a different claim from "newest thing published". It lagged
        # `latest` by nine versions the day this was written, and that
        # lag is the feature.
        #
        # A tag rather than an exact pin, because a pin's failure mode is
        # nobody moving it: it would sit at whatever was current the day
        # the pipeline last broke, accumulating a year of fixes nobody
        # opted out of. The tag still moves under us — the same class of
        # hazard, much rarer, and now attributable, which is the other
        # half of this.
        #
        # Resolved to a concrete version first, and printed. The tag is
        # what this follows; the number is what a failed run has to be
        # able to name. Diagnosing ORC-6 meant bracketing the break
        # against a version nobody had recorded — the log said which
        # credential was used and not which CLI.
        CLI_TAG="stable"
        # Used only when the registry cannot be asked. Known-good rather
        # than arbitrary: it is what unblocked ORC-6, verified by hand.
        # An unresolvable tag must not become `claude-code@`, which
        # installs nothing and fails as if the model had.
        CLI_FALLBACK="2.1.236"
        CLI_VERSION="$(npm view "@anthropic-ai/claude-code@$CLI_TAG" version 2>/dev/null || true)"
        case "$CLI_VERSION" in
        [0-9]*)
          echo "claude-code $CLI_VERSION (dist-tag: $CLI_TAG)"
          ;;
        *)
          echo "::warning::could not resolve the $CLI_TAG dist-tag; using the pinned fallback $CLI_FALLBACK"
          CLI_VERSION="$CLI_FALLBACK"
          ;;
        esac

        # `-p/--print` is a boolean flag and the prompt is a positional
        # argument, so the prompt was never `-p`'s value — it was its own
        # argv element, and that is the one the cap applies to. Dropping
        # the positional makes the CLI read the prompt from stdin, which
        # is what `--input-format text (default)` and "-p ... useful for
        # pipes" describe. Checked against the CLI rather than assumed.
        #
        # A redirect rather than a pipe: each attempt re-reads the file,
        # so the failover gets the whole prompt rather than the remains
        # of a stream the first attempt drained.
        attempt() {
          case "$1" in
          subscription)
            env -u ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN="$SUBSCRIPTION_TOKEN" \
              npx --yes "@anthropic-ai/claude-code@$CLI_VERSION" \
                -p \
                --dangerously-skip-permissions < "$PROMPT_PATH"
            ;;
          api)
            env -u CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY="$API_KEY" \
              npx --yes "@anthropic-ai/claude-code@$CLI_VERSION" \
                -p \
                --dangerously-skip-permissions < "$PROMPT_PATH"
            ;;
          esac
        }

        # attempt, with its output kept rather than only shown.
        #
        # Until now the run's only record was the workflow log, and the
        # ticket said "Design agent run failed: <url>" — so a bare exit
        # 249 arrived with nothing attached and nothing to look up. The
        # code is the CLI's, not this harness's, which is exactly why the
        # output beside it is the part worth keeping.
        #
        # Both streams, because which one carries the failure is the
        # CLI's business and not something to assume: stdout is piped
        # through `tee` so it still streams into the log live, and stderr
        # is captured to a file and replayed after. Ordering between the
        # two is lost in the log, which is the price.
        #
        # `| tee` rather than `2> >(tee ...)`: process substitution is
        # asynchronous, so the reader has no guarantee of having flushed
        # by the time the step ends — the same race that cost the claim
        # step its stderr.
        run_attempt() {
          local mode="$1"
          local err="$LOGDIR/model-$mode.err" out="$LOGDIR/model-$mode.out"
          local rc
          attempt "$mode" 2> "$err" | tee "$out"
          rc="${PIPESTATUS[0]}"
          cat "$err" >&2
          if [ "$rc" -ne 0 ]; then
            report "$mode" "$rc" "$err" "$out"
          fi
          return "$rc"
        }

        report() {
          local mode="$1" rc="$2" err="$3" out="$4" note=""
          # 129-159 is the shell's own convention for a process killed by
          # signal rc-128, so decoding that range states a fact. Anything
          # else is the program's exit table, which is not this harness's
          # to guess at — inventing a meaning for 249 would be how the
          # number becomes misleading rather than merely opaque.
          if [ "$rc" -ge 129 ] && [ "$rc" -le 159 ]; then
            note=" (killed by signal $((rc - 128)))"
          fi
          echo "::error::the $mode model run exited $rc$note"
          {
            echo "the $mode model run exited $rc$note"
            echo
            echo "--- stderr ---"
            if [ -s "$err" ]; then
              tail -n 60 "$err"
            else
              echo "(empty: the run wrote nothing to stderr)"
            fi
            echo "--- last of stdout ---"
            if [ -s "$out" ]; then
              tail -n 30 "$out"
            else
              echo "(empty: the run wrote nothing to stdout)"
            fi
          } > "$ERRFILE"
          echo "$rc" > "$CODEFILE"
          # The run summary, so the failure is legible without opening a
          # collapsed step — the same reason the audit writes one.
          {
            echo "### Model run failed — $mode credential, exit $rc$note"
            echo
            echo '```'
            cat "$ERRFILE"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
        }

        if [ -z "$SUBSCRIPTION_TOKEN" ]; then
          echo "model credential: API key (no subscription token configured)"
          run_attempt api
          exit $?
        fi

        echo "model credential: subscription"
        status=0
        run_attempt subscription || status=$?
        if [ "$status" -eq 0 ]; then
          exit 0
        fi

        if [ -z "$API_KEY" ]; then
          echo "::error::the subscription run exited $status and no anthropic_api_key is set to fail over to" >&2
          exit "$status"
        fi

        # Any non-zero exit fails over, not just an exhausted allowance:
        # the alternative is matching strings in someone else's error
        # output and deciding the ticket's fate on the match. One retry,
        # so a genuinely broken prompt costs two runs rather than looping.
        #
        # The retry is not a clean slate — whatever the first attempt
        # wrote to the working tree is still there, and the second reads
        # it as prior state. That is the same tree a resumed pass would
        # see, and discarding it would throw away real work when the
        # exhaustion lands near the end of a pass.
        echo "::warning::the subscription run exited $status — retrying once on the API key"
        run_attempt api
        status=$?
        if [ "$status" -eq 0 ]; then
          # The failover worked, so the run did not fail — clear the
          # first attempt's evidence rather than leaving it to be read as
          # this run's cause of death.
          rm -f "$ERRFILE" "$CODEFILE"
        fi
        exit "$status"
