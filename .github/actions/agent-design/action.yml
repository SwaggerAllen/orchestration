# Design-agent run (DESIGN §4, §6, §7). The harness brackets the
# model: claim asserts and marks, the model designs and writes an
# outcome, finish lands it (draft PR + Design review, screenless
# auto-pass, clear, or demote).
#
# A composite action rather than a reusable workflow, because the calling
# job must be able to run its own steps first: a project's toolchain is
# project-specific and no reusable workflow can accept `uses:` steps as
# an input. The caller checks out the project, sets up its language, then
# calls this — see examples/stubs/pipeline-agent-design.yml.
#
# The caller's checkout needs fetch-depth: 0; the branch work below
# fetches and switches refs.
name: pipeline design agent
description: Claim a ticket, run the design pass, land the outcome

inputs:
  ticket:
    description: Ticket key, e.g. PIPE-12
    required: true
  linear_api_key:
    description: Linear API key
    required: true
  pipeline_state_token:
    description: >
      Secret for the pipeline's own move record (DESIGN 9). Every
      transition is written down before it is made, and a project
      without this records nothing — which turns the invariants off
      rather than failing, so its absence is worth noticing.
    required: false
    default: ""
  github_token:
    # Described in prose, not as an expression: an action's metadata is
    # templated and the github context does not exist there, so an
    # expression here fails the whole file to load before any step runs.
    description: Token for the project repo. Pass the caller's github.token.
    required: true
  cloudflare_api_token:
    description: >-
      Cloudflare token with Pages edit rights, for publishing this
      branch's storybook export. Omit to skip publishing.
    required: false
    default: ""
  cloudflare_account_id:
    description: Cloudflare account id, alongside cloudflare_api_token
    required: false
    default: ""
  pipeline_repo_token:
    description: >-
      Contents:read PAT for the pipeline repo while it is private.
      Falls back to github_token, which suffices once it is public.
    required: false
    default: ""
  pipeline_ref:
    description: Pipeline repo ref to run the harness from
    required: false
    default: main
  anthropic_api_key:
    description: >-
      Console API key for the agent run, billed against API credits.
      Optional when a subscription token is set, where it is the
      failover rather than the first choice.
    required: false
    default: ""
  claude_code_oauth_token:
    description: >-
      Long-lived Claude Code token from `claude setup-token`, billed
      against a Claude subscription. Tried before anthropic_api_key.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Nested rather than asked of the caller so a project's stub needs
    # no change to get this. The ref pins the *recipe*; the binary it
    # builds comes from inputs.pipeline_ref, so a caller pinned to a
    # release still runs that release's harness.
    - name: set up the pipeline
      uses: SwaggerAllen/orchestration/.github/actions/setup-pipeline@main
      with:
        pipeline_repo_token: ${{ inputs.pipeline_repo_token }}
        pipeline_ref: ${{ inputs.pipeline_ref }}

    - name: claim
      id: claim
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        PIPELINE_STATE_TOKEN: ${{ inputs.pipeline_state_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        # stderr is captured as well as shown, because the step after
        # this one puts it on the ticket. A claim that dies takes the
        # only other channel with it: abort needs claim.json to know
        # what it is aborting, so the loudest failures used to leave
        # nothing at all behind (DESIGN §12).
        # mkdir first: the redirect below opens the file before the
        # claim runs, and the claim is what would otherwise create the
        # directory — so without this the step dies on the redirect,
        # before the command it is trying to capture.
        mkdir -p "$RUNNER_TEMP/pipeline"
        set +e
        pipeline agent claim \
          --kind design \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --ticket "${{ inputs.ticket }}" \
          --dispatch-id "${{ github.run_id }}" \
          --dispatch-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --out "$RUNNER_TEMP/pipeline" \
          --prompt-template "$GITHUB_WORKSPACE/.pipeline/prompts/design.md" \
          --repo-context "$GITHUB_WORKSPACE/.pipeline/prompts/repo-context.md" \
          --outcome-path "$RUNNER_TEMP/pipeline/outcome.json" \
          --findings-path "$RUNNER_TEMP/pipeline/findings.json" \
          2> "$RUNNER_TEMP/pipeline/claim-error.txt"
        rc=$?
        # Written to a file rather than a step output: an output on a
        # failed step is not somewhere to bet a state transition on, and
        # the next step reads this to tell a refused pickup (the
        # pipeline working) from a harness failure (the author's).
        echo "$rc" > "$RUNNER_TEMP/pipeline/claim-exit-code.txt"
        cat "$RUNNER_TEMP/pipeline/claim-error.txt" >&2
        exit $rc

    - name: check out the ticket branch
      id: branch
      shell: bash
      run: |
        git config user.name "pipeline-design-agent"
        git config user.email "pipeline@invalid"
        BRANCH="${{ steps.claim.outputs.branch }}"
        git fetch origin
        git checkout -B "$BRANCH" "origin/$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" origin/main
        # The pipeline checkout must not ride along in the project branch.
        echo ".pipeline/" >> .git/info/exclude
        # Where this pass starts, for the ownership audit at finish
        # (DESIGN 5). Recorded here rather than derived from origin/main
        # later, because a re-pass runs on a branch that already carries
        # the earlier passes' artifacts and dev's commits — diffing
        # against main would bill this pass for all of them.
        echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        # What this branch already carries, for the prompt. A pass that
        # failed *after* pushing leaves complete work here and nothing in
        # the prompt saying so, and the role prompt tells the agent it is
        # re-instantiated with no memory and that everything it needs is
        # in the prompt and the repository — so an agent following it
        # literally starts fresh and redraws what is already committed
        # (ORC-69, run 32048439216: 209fc9d pushed, then the run failed).
        #
        # Read off the branch rather than from a record of the push: a
        # run can die without ever reaching its abort step, and the
        # branch is true either way. Empty on a first pass, which the
        # prompt states rather than omits.
        git log --oneline origin/main..HEAD > "$RUNNER_TEMP/pipeline/prior-work.txt" 2>/dev/null || : > "$RUNNER_TEMP/pipeline/prior-work.txt"
        cat "$RUNNER_TEMP/pipeline/prior-work.txt"

    # The prompt inlines the confirmed non-asks (DESIGN §4), and claim
    # assembled it one step too early: the branch to check out is an
    # output of the claim, so the tree was still on main. This pass
    # maintains that document on the branch, so on a re-pass the copy
    # handed to the model had its own earlier decisions deleted from it —
    # measured on ORC-16, where the third pass was shown none of the
    # eleven entries the first two had written.
    # No tracker credential: the claim is already made and on disk, so
    # this reads claim.json and the working tree and talks to nothing.
    - name: rebuild the prompt against the branch
      shell: bash
      run: |
        pipeline agent reprompt \
          --kind design \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --out "$RUNNER_TEMP/pipeline" \
          --prompt-template "$GITHUB_WORKSPACE/.pipeline/prompts/design.md" \
          --repo-context "$GITHUB_WORKSPACE/.pipeline/prompts/repo-context.md" \
          --outcome-path "$RUNNER_TEMP/pipeline/outcome.json" \
          --findings-path "$RUNNER_TEMP/pipeline/findings.json" \
          --prior-work "$RUNNER_TEMP/pipeline/prior-work.txt"

    # The merge-base the design is drawn against (DESIGN §2.4), read
    # before the model writes anything. Computed here rather than in the
    # harness because only the runner has the checkout, and taken as a
    # merge-base rather than as origin/main's tip so a branch that
    # already existed reports the point it actually diverged.
    - name: read the merge-base
      id: base
      shell: bash
      run: |
        set -euo pipefail
        git fetch origin +refs/heads/main:refs/remotes/origin/main
        echo "sha=$(git merge-base HEAD origin/main)" >> "$GITHUB_OUTPUT"

    - name: run the design agent
      uses: SwaggerAllen/orchestration/.github/actions/run-agent-model@main
      with:
        prompt_path: ${{ runner.temp }}/pipeline/prompt.md
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        anthropic_api_key: ${{ inputs.anthropic_api_key }}

    - name: push artifacts (if any)
      shell: bash
      run: |
        # `git status --porcelain`, not `git diff`: diff inspects tracked
        # files only, so a pass whose whole output is NEW files passes a
        # `git diff --quiet` guard as clean, the net below never fires,
        # and the artifacts die with the runner while the run reports
        # success. That is the shape of a first design pass on a new
        # screen — every file it writes is new.
        #
        #   $ git status --porcelain      # only an untracked file
        #   ?? screens/cap.md
        #   $ git diff --quiet; echo $?
        #   0
        #
        # Measured alongside the `git add` fix below, which is how it was
        # found: verifying that fix against a realistic pass produced a
        # run that committed nothing and said nothing. Losing artifacts
        # loudly was the bug being fixed; this loses them quietly.
        if [ -n "$(git status --porcelain)" ]; then
          # No pathspec. `.pipeline/` is already in .git/info/exclude,
          # written by the branch step above, and `git add -A` skips an
          # excluded path silently — but ANY pathspec, including a pure
          # exclusion, switches add into the mode where an excluded path
          # it touches is a hard error rather than a skip:
          #
          #   $ git add -A ':!.pipeline'
          #   The following paths are ignored by one of your .gitignore
          #   files: .pipeline
          #   hint: Use -f if you really want to add them.
          #   $ echo $?
          #   1
          #
          # Measured on git 2.43.0 against the runner's own setup, and
          # `git add -A` alone exits 0 and stages exactly the same files.
          # So `:!.pipeline` was redundant with the exclude and fatal
          # under `set -e`.
          #
          # It cost a whole design pass. Catapult ORC-92, run
          # 32496587226: the model ran nine minutes and succeeded, this
          # step died in 28ms before the commit and before the push, and
          # the branch never reached origin — the ticket went to Blocked
          # saying only "Design agent run failed: <url>". Latent since
          # the actions first shipped, because this block is the safety
          # net for a pass that ends dirty rather than the normal path.
          git add -A
          git commit -m "wip: uncommitted design artifacts at end of agent run"
        fi
        # A screenless pass has no commits; pushing an unchanged branch
        # is a no-op that must not fail the run.
        if [ -n "$(git log origin/main..HEAD --oneline 2>/dev/null)" ]; then
          git push -u origin "${{ steps.claim.outputs.branch }}"
          # Written only once the push has actually landed, and read by
          # the abort step below. Without it a failed run's comment says
          # only "Design agent run failed: <url>" — the same sentence
          # whether it left a complete pass on the branch or nothing at
          # all, and those want different decisions from the author.
          git rev-parse HEAD > "$RUNNER_TEMP/pipeline/pushed.txt"
        fi
        # What this pass wrote, scoped to this pass, for the finish
        # step's ownership audit. Written after the push on purpose: a
        # pass that strayed is blocked at finish and the author reads
        # the diff to strip it, so the files have to be somewhere to
        # read.
        git diff --name-only "${{ steps.branch.outputs.before }}"..HEAD \
          > "$RUNNER_TEMP/pipeline/changed.txt"
        cat "$RUNNER_TEMP/pipeline/changed.txt"

    # The branch preview, published by the harness rather than by a
    # workflow watching for a push. That watcher could never fire for
    # this push: GitHub does not start a workflow run from an event
    # created with GITHUB_TOKEN, which is what the step above pushes
    # with — so previews were built for a human's branches and never for
    # an agent's. The author reviews the storybook export at Design
    # review (DESIGN 4), so the missing one was missing from the exact
    # sign-off it exists for.
    #
    # Skipped rather than failed when no Cloudflare token is passed: a
    # project without previews wired yet still gets its agent runs, and
    # the step says which it did.
    - name: build the storybook export
      if: inputs.cloudflare_api_token != ''
      shell: bash
      run: |
        set -euo pipefail
        CMD="$(jq -r .preview.buildCommand "$GITHUB_WORKSPACE/pipeline.config.json")"
        echo "preview build: $CMD"
        cd "$GITHUB_WORKSPACE" && eval "$CMD"

    - name: read the preview target
      id: preview
      if: inputs.cloudflare_api_token != ''
      shell: bash
      run: |
        set -euo pipefail
        CFG="$GITHUB_WORKSPACE/pipeline.config.json"
        # Read from the config, never written here: a second copy drifts,
        # and then previews publish to one project while cleanup deletes
        # from another with nothing to say so.
        echo "project=$(jq -r .preview.pagesProject "$CFG")" >> "$GITHUB_OUTPUT"
        echo "dir=$(jq -r .preview.outputDir "$CFG")" >> "$GITHUB_OUTPUT"

    - name: publish the preview
      id: published
      if: inputs.cloudflare_api_token != ''
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare_api_token }}
        accountId: ${{ inputs.cloudflare_account_id }}
        workingDirectory: ${{ github.workspace }}
        command: >-
          pages deploy ${{ steps.preview.outputs.dir }}
          --project-name=${{ steps.preview.outputs.project }}
          --branch=${{ steps.claim.outputs.branch }}
    - name: finish
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        PIPELINE_STATE_TOKEN: ${{ inputs.pipeline_state_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        # The URL comes from wrangler rather than being rebuilt from the
        # branch name and the Pages project. Cloudflare's branch-alias
        # slugging is its own rule — truncation and hashing included —
        # so deriving it would be guessing at someone else's algorithm
        # and posting the guess to the author as a link.

        # stderr captured as well as shown, for the reason the claim's
        # is: this step's failure reaches the ticket as "run failed:
        # <url>" and nothing else, so a Go error that says exactly what
        # went wrong ends its life in a collapsed step nobody opens.
        # `abort on failure` reads this file back.
        mkdir -p "$RUNNER_TEMP/pipeline"
        set +e
        pipeline agent finish \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --claim "$RUNNER_TEMP/pipeline/claim.json" \
          --outcome "$RUNNER_TEMP/pipeline/outcome.json" \
          --preview-url "${{ steps.published.outputs.deployment-url }}" \
          --base-sha "${{ steps.base.outputs.sha }}" \
          --changed-files "$RUNNER_TEMP/pipeline/changed.txt" \
          --findings "$RUNNER_TEMP/pipeline/findings.json" \
          2> "$RUNNER_TEMP/pipeline/run-error.txt"
        rc=$?
        cat "$RUNNER_TEMP/pipeline/run-error.txt" >&2
        exit $rc

    - name: say so when the claim itself failed
      if: failure() && steps.claim.outcome == 'failure'
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
      run: |
        # Routes on the claim's exit status: a refused pickup is the
        # pipeline working and only earns a comment, while a harness
        # failure parks the ticket in Blocked — the same place the
        # stale-claim rule would reach twenty minutes later, with the
        # reason attached instead of "a run stopped being live".
        pipeline agent claim-failed \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --ticket "${{ inputs.ticket }}" \
          --kind design \
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --error-file "$RUNNER_TEMP/pipeline/claim-error.txt" \
          --exit-code-file "$RUNNER_TEMP/pipeline/claim-exit-code.txt"

    - name: abort on failure
      if: failure() && steps.claim.outcome == 'success'
      shell: bash
      env:
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        PIPELINE_STATE_TOKEN: ${{ inputs.pipeline_state_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        pipeline agent abort \
          --config "$GITHUB_WORKSPACE/pipeline.config.json" \
          --claim "$RUNNER_TEMP/pipeline/claim.json" \
          --reason failed \
          --findings "$RUNNER_TEMP/pipeline/findings.json" \
          --error-file "$RUNNER_TEMP/pipeline/run-error.txt" \
          --outcome "$RUNNER_TEMP/pipeline/outcome.json" \
          --pushed-file "$RUNNER_TEMP/pipeline/pushed.txt" \
          --message "Design agent run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
