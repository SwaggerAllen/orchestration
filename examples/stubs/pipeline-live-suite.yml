# Project stub: live suite. run-name is load-bearing (correlation).
name: pipeline-live-suite
run-name: "pipeline: live-suite ${{ inputs.ticket }}"

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Boundary ticket key
        required: true
        type: string

# Stated explicitly because a called workflow cannot be granted more
# than the calling job holds, and a caller with no permissions block
# inherits the repository default — restrictive on a new repo. When the
# callee asks for more, the run dies before a runner is allocated:
# "startup_failure", with no job and no logs to read.
permissions:
  contents: read # checkout only

jobs:
  live:
    uses: SwaggerAllen/orchestration/.github/workflows/live-suite.yml@main
    with:
      ticket: ${{ inputs.ticket }}
      # The project's :live-tagged tests: real network, real providers,
      # budget-capped. This is the once-per-milestone end-to-end check.
      command: "mix test --only live"
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      PIPELINE_REPO_TOKEN: ${{ secrets.PIPELINE_REPO_TOKEN }}
