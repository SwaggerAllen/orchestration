# Project stub: design agent. run-name is load-bearing (correlation).
name: pipeline-agent-design
run-name: "pipeline: design ${{ inputs.ticket }}"

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Ticket key, e.g. PIPE-12
        required: true
        type: string

# Stated explicitly because a called workflow cannot be granted more
# than the calling job holds, and a caller with no permissions block
# inherits the repository default — restrictive on a new repo. When the
# callee asks for more, the run dies before a runner is allocated:
# "startup_failure", with no job and no logs to read.
permissions:
  contents: write # the design pass commits screens/ and systems/
  pull-requests: write # opens the ticket's PR

jobs:
  design:
    uses: SwaggerAllen/orchestration/.github/workflows/agent-design.yml@main
    with:
      ticket: ${{ inputs.ticket }}
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PIPELINE_REPO_TOKEN: ${{ secrets.PIPELINE_REPO_TOKEN }}
