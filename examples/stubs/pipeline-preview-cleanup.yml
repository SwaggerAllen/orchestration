# Project stub: delete a branch's Pages previews when its PR closes
# (DESIGN §4). Fires on merge and on abandonment alike — both mean the
# preview has nothing left to review.
name: pipeline-preview-cleanup
run-name: "pipeline: preview-cleanup ${{ github.event.pull_request.head.ref }}"

on:
  pull_request:
    types: [closed]

# Stated explicitly because a called workflow cannot be granted more
# than the calling job holds, and a caller with no permissions block
# inherits the repository default — restrictive on a new repo. When the
# callee asks for more, the run dies before a runner is allocated:
# "startup_failure", with no job and no logs to read.
permissions:
  contents: read # reads the project name out of the config

jobs:
  # A reusable-workflow call runs no steps of its own, so reading the
  # project name out of the config takes a job. Worth it: the alternative
  # is a second copy of the name that drifts from the one the preview
  # publishes to, and then cleanup quietly deletes from the wrong project.
  config:
    runs-on: ubuntu-latest
    outputs:
      pages_project: ${{ steps.read.outputs.pages_project }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "pages_project=$(jq -r .preview.pagesProject pipeline.config.json)" >> "$GITHUB_OUTPUT"

  cleanup:
    needs: config
    uses: SwaggerAllen/orchestration/.github/workflows/preview-cleanup.yml@main
    with:
      branch: ${{ github.event.pull_request.head.ref }}
      pages_project: ${{ needs.config.outputs.pages_project }}
      production_branch: main
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
