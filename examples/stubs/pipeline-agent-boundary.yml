# Project stub: boundary agent. run-name is load-bearing (correlation).
name: pipeline-agent-boundary
run-name: "pipeline: boundary ${{ inputs.ticket }}"

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Boundary ticket key
        required: true
        type: string

# Stated explicitly because a called workflow cannot be granted more
# than the calling job holds, and a caller with no permissions block
# inherits the repository default — restrictive on a new repo. When the
# callee asks for more, the run dies before a runner is allocated:
# "startup_failure", with no job and no logs to read.
permissions:
  contents: write # writes the retro note, and reads ancestry
  pull-requests: read # the snapshot's open PR list
  actions: read # the snapshot's agent run list
  checks: read # CI verdict per PR head

jobs:
  boundary:
    uses: SwaggerAllen/orchestration/.github/workflows/agent-boundary.yml@main
    with:
      ticket: ${{ inputs.ticket }}
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PIPELINE_REPO_TOKEN: ${{ secrets.PIPELINE_REPO_TOKEN }}
