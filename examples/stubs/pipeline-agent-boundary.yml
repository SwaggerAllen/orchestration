# Project stub: boundary agent.
#
# run-name is load-bearing: "pipeline: boundary <ticket>" is how the
# control plane correlates this run to its ticket (stale claims, busy
# checks). Set it exactly.
name: pipeline-agent-boundary
run-name: "pipeline: boundary ${{ inputs.ticket }}"

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Ticket key, e.g. PIPE-12
        required: true
        type: string

# Every pipeline command builds a snapshot first, and the snapshot has a
# fixed read-set: the agent run list (actions), the open PRs
# (pull-requests), each PR head's CI verdict (checks), and commit
# ancestry (contents). Those are needed even by a run that only writes a
# comment — the cost of reading the world, not of changing it. A missing
# one surfaces as an HTTP 403 partway through the claim.
#
# Opening the draft PR additionally needs the repository setting
# Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". No workflow file can grant it.
permissions:
  contents: write # writes the retro note, and reads ancestry
  pull-requests: read # the snapshot's open PR list
  actions: read # the snapshot's agent run list, and the CI verdict per PR head
  deployments: read # deploy state, when the project's provider is "github"

jobs:
  boundary:
    runs-on: ubuntu-latest
    # Uncomment and match ci.yml when the project's tests need a service.
    # It belongs here, at job level, not among the steps above.
    # services:
    #   postgres:
    #     image: postgres:16
    #     env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
    #     ports: ["5432:5432"]
    #     options: >-
    #       --health-cmd pg_isready --health-interval 5s
    #       --health-timeout 5s --health-retries 10
    steps:
      # fetch-depth: 0 — the retro note is written against history.
      # Checked out with the agent token so the push carries it. The
      # default GITHUB_TOKEN works for the push itself, but GitHub does
      # not start a workflow run from an event it created — so CI never
      # ran, previews never built, deploys were never recorded — and a
      # PR it opens is authored by github-actions[bot], which GitHub
      # gates behind a manual approval on every ticket. See SETUP 2.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          fetch-depth: 0

      # ---- this project's environment, before the pipeline runs --------
      # Everything the project's OWN commands need, not just its
      # toolchain. An agent runs the config's `qualityGates` before it
      # finishes; the live suite runs the project's test command. So this
      # job needs whatever those need: the language, the dependencies,
      # and any service the tests talk to.
      #
      # The rule that keeps this right: THIS IS YOUR ci.yml JOB'S
      # ENVIRONMENT. The live suite is that job with a different filter;
      # an agent run is that job plus a model. Copy ci.yml's setup steps
      # and its `services:` block across rather than reconstructing them,
      # and when ci.yml gains one, this gains it too.
      #
      # Two runs have already been lost to the narrower reading, both
      # with a correct toolchain: a dev agent found `mix test` unable to
      # reach a database CI provides and started one by hand, and a
      # design pass found the live suite unable to start at all because
      # nothing had installed dependencies. Replace the steps below with
      # whatever this project needs.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"
      - run: mix deps.get
      # ------------------------------------------------------------------

      # Pin to a pipeline release tag (@v1) once one exists; main while
      # the pipeline itself is under construction (DESIGN §5).
      - uses: SwaggerAllen/orchestration/.github/actions/agent-boundary@main
        with:
          ticket: ${{ inputs.ticket }}
          linear_api_key: ${{ secrets.LINEAR_API_KEY }}
          pipeline_state_token: ${{ secrets.PIPELINE_STATE_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          pipeline_repo_token: ${{ secrets.PIPELINE_REPO_TOKEN }}
