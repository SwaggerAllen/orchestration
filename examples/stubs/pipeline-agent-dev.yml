# Project stub: dev agent.
#
# run-name is load-bearing: "pipeline: dev <ticket>" is how the
# control plane correlates this run to its ticket (stale claims, busy
# checks). Set it exactly.
name: pipeline-agent-dev
run-name: "pipeline: dev ${{ inputs.ticket }}"

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Ticket key, e.g. PIPE-12
        required: true
        type: string

# Every pipeline command builds a snapshot first, and the snapshot has a
# fixed read-set: the agent run list (actions), the open PRs
# (pull-requests), each PR head's CI verdict (checks), and commit
# ancestry (contents). Those are needed even by a run that only writes a
# comment — the cost of reading the world, not of changing it. A missing
# one surfaces as an HTTP 403 partway through the claim.
#
# Opening the draft PR additionally needs the repository setting
# Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". No workflow file can grant it.
permissions:
  contents: write # commits the implementation, and reads ancestry
  pull-requests: write # opens or un-drafts the PR, and reads the open list
  actions: read # the snapshot's agent run list
  checks: read # CI verdict per PR head

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the agent switches to the ticket branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- this project's toolchain, before the agent runs --------------
      # The whole reason the pipeline ships composite actions rather than
      # reusable workflows: a reusable workflow cannot accept `uses:`
      # steps, so there was nowhere to put this and agents ran without
      # the language they were being asked to write in. Replace with
      # whatever this project needs.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"
      # ------------------------------------------------------------------

      # Pin to a pipeline release tag (@v1) once one exists; main while
      # the pipeline itself is under construction (DESIGN §5).
      - uses: SwaggerAllen/orchestration/.github/actions/agent-dev@main
        with:
          ticket: ${{ inputs.ticket }}
          linear_api_key: ${{ secrets.LINEAR_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Publishes this branch's storybook export. Drop both
          # lines to run agents without previews.
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github_token: ${{ github.token }}
          pipeline_repo_token: ${{ secrets.PIPELINE_REPO_TOKEN }}
