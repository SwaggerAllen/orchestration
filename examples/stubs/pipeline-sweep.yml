# Project stub: control-plane sweep. Copy into the project repo's
# .github/workflows/.
#
# Two triggers, per DESIGN §13:
#   - workflow_dispatch: the metronome. It fires on a Linear webhook the
#     moment the tracker changes, and hourly regardless for the
#     elapsed-time conditions nothing announces — stale claims, deploy
#     timeouts. GitHub's own `schedule:` is deliberately not used: its
#     5-15 minute jitter compounds across every hop of a ticket's life.
#   - workflow_run: the CI hops. When the project's CI completes, a sweep
#     runs immediately, so Checks -> Reconciling and CI-red -> rework
#     never wait for the poll.
#   - deployment_status: the post-deploy check, which is the last hop of
#     a ticket's life and otherwise the one most likely to sit waiting
#     on the clock. Only fires where the platform records GitHub
#     Deployments; a DO-hosted project drops this trigger and lets the
#     hourly beat find it.
name: pipeline-sweep
run-name: "pipeline: sweep"

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
  deployment_status:

# Declaring this block at all drops every permission not listed to
# none, so it has to name everything the snapshot reads, not just the
# unusual ones. One line per call the sweep makes:
permissions:
  contents: read # checkout, and compare for the deploy ancestry check
  actions: write # dispatching agent workflows; write covers listing runs
  pull-requests: read # the open-PR list the snapshot is built from
  checks: read # CI verdicts per PR head, which drive the Checks hop

# One dispatcher at a time: the single-dev-agent invariant is only as
# strong as single-dispatcher (DESIGN §13).
concurrency:
  group: pipeline-control-plane
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      PIPELINE_KILL_SWITCH: ${{ vars.PIPELINE_KILL_SWITCH }}
    steps:
      - name: checkout project (for pipeline.config.json)
        uses: actions/checkout@v4

      - name: checkout pipeline
        uses: actions/checkout@v4
        with:
          repository: SwaggerAllen/orchestration
          ref: main # pin to @v1 once released
          path: .pipeline
          token: ${{ secrets.PIPELINE_REPO_TOKEN || github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: .pipeline/go.mod

      - name: sweep
        run: |
          go -C "$GITHUB_WORKSPACE/.pipeline" run ./cmd/pipeline sweep \
            --config "$GITHUB_WORKSPACE/pipeline.config.json"
