# Project stub: control-plane sweep. Copy into the project repo's
# .github/workflows/.
#
# Two triggers, per DESIGN §13:
#   - workflow_dispatch: the metronome. It fires on a Linear webhook the
#     moment the tracker changes, and hourly regardless for the
#     elapsed-time conditions nothing announces — stale claims, deploy
#     timeouts. GitHub's own `schedule:` is deliberately not used: its
#     5-15 minute jitter compounds across every hop of a ticket's life.
#   - workflow_run: the CI hops. When the project's CI completes, a sweep
#     runs immediately, so Checks -> Reconciling and CI-red -> rework
#     never wait for the poll.
#   - deployment_status: the post-deploy check, which is the last hop of
#     a ticket's life and otherwise the one most likely to sit waiting
#     on the clock. Only fires where the platform records GitHub
#     Deployments; a DO-hosted project drops this trigger and lets the
#     hourly beat find it.
name: pipeline-sweep
run-name: "pipeline: sweep"

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
  deployment_status:

# Declaring this block at all drops every permission not listed to
# none, so it has to name everything the snapshot reads, not just the
# unusual ones. One line per call the sweep makes:
permissions:
  contents: read # checkout, and compare for the deploy ancestry check
  actions: write # dispatching agent workflows; write covers listing runs
  pull-requests: read # the open-PR list the snapshot is built from
  checks: read # CI verdicts per PR head, which drive the Checks hop
  deployments: read # deploy state, when the project's provider is "github"

# One dispatcher at a time: the single-dev-agent invariant is only as
# strong as single-dispatcher (DESIGN §13).
concurrency:
  group: pipeline-control-plane
  cancel-in-progress: false

jobs:
  sweep:
    # The kill switch stops the job, not just the work inside it.
    #
    # `PIPELINE_KILL_SWITCH` already halted planning — the binary builds
    # a snapshot, sees the flag and produces nothing (DESIGN §13). That
    # is correct and it is not free: Actions bills each job rounded up to
    # the nearest minute, so an idle project on the hourly beat spends
    # roughly 730 minutes a month doing nothing. A job whose `if` is
    # false never starts and is billed nothing at all.
    #
    # This is what lets a project be genuinely parked. A rehearsal repo
    # between rehearsals, or a project paused for a week, costs zero
    # instead of most of a plan's allowance. The env var below stays: a
    # hand-dispatched run with the flag on still refuses inside the
    # binary, so the two agree rather than one guarding the other.
    if: vars.PIPELINE_KILL_SWITCH != 'true'
    runs-on: ubuntu-latest
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      PIPELINE_STATE_TOKEN: ${{ secrets.PIPELINE_STATE_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      PIPELINE_KILL_SWITCH: ${{ vars.PIPELINE_KILL_SWITCH }}
      # Deploy detection for API-polled providers (digitalocean).
      # Optional: without it the pipeline warns and deploy detection
      # is off, so Merged tickets ride to the timeout.
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
    steps:
      - name: checkout project (for pipeline.config.json)
        uses: actions/checkout@v4

      # Checks out the pipeline and puts its binary on PATH, built once
      # per pipeline commit and restored from cache after that. The
      # sweep runs hourly and on every webhook, so it is the single
      # biggest consumer of the compile this avoids.
      - name: set up the pipeline
        uses: SwaggerAllen/orchestration/.github/actions/setup-pipeline@main
        with:
          pipeline_repo_token: ${{ secrets.PIPELINE_REPO_TOKEN }}
          pipeline_ref: main # pin to @v1 once released

      - name: sweep
        run: |
          pipeline sweep \
            --config "$GITHUB_WORKSPACE/pipeline.config.json"
