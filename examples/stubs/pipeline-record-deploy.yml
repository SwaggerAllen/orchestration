# Project stub (dummy project only): record a GitHub Deployment per push
# to main, so the pipeline's deploy detection has something real to read
# without a hosting platform (PLAN M4). A real DO-deployed project does
# NOT carry this stub — App Platform's deployments API is read instead
# (config deploy.provider: digitalocean).
name: pipeline-record-deploy
run-name: "pipeline: record deploy"

on:
  push:
    branches: [main]

permissions:
  deployments: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: create deployment and mark success
        uses: actions/github-script@v7
        with:
          script: |
            const { data: dep } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "production",
              auto_merge: false,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.id,
              state: "success",
            });
